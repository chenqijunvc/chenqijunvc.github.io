title:              "Vince Qijun Chen"
email:              chenqijunvc@gmail.com
description:        "Modern active portfolio management combining quantamental strategies with AI-driven insights"
author:             Vince Qijun Chen
# For root domain (chenqijunvc.github.io), baseurl should be empty
baseurl:            ""
url:                "https://chenqijunvc.github.io"

# SEO and Social
keywords:           "Vince Qijun Chen, portfolio manager, AI-driven investing, quantamental investing, free cash flow, FCF-ROIC, ETF strategy, machine learning finance, investment management"
lang:               "en"
locale:             "en_US"

# Social Profiles
twitter_username:   # Your Twitter username when available
github_username:    chenqijunvc
linkedin_username:  vinceqijunchen

# Analytics - Replace with your actual Google Analytics 4 ID
# google_analytics:   G-XXXXXXXXXX

# Author information for structured data
author_info:
  name:             "Vince Qijun Chen"
  bio:              "Portfolio manager specializing in AI-enhanced quantamental strategies and ETF development"
  location:         "Global"
  expertise:        ["AI-Driven Investing", "Quantamental Analysis", "ETF Strategy", "Portfolio Management", "Financial Media"]

# Build settings
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"

# URL structure - no trailing slashes
permalink:          /:title/

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# Collections
collections:
  media:
    output: true
    permalink: /media/:title/

# Dynamic background images
default_backgrounds:
  home: '/img/bg-index.jpg'
  about: '/img/bg-about.jpg'
  posts: '/img/bg-post.jpg'
  contact: '/img/bg-contact.jpg'
  search: '/img/bg-post.jpg'
  default: '/img/bg-post.jpg'

# Category-specific backgrounds
category_backgrounds:
  ai: '/img/bg-post.jpg'
  finance: '/img/bg-post.jpg'
  data-science: '/img/bg-post.jpg'
  investment-strategy: '/img/bg-post.jpg'