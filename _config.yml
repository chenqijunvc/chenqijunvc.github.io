title:              "Vince Chen"
email:              chenqijunvc@gmail.com
description:        "Investment Architect. Portfolio Manager. Quantitative Researcher. Designing investment research, quantitative methodologies, portfolio processes, and institutional investment infrastructure."
author:             Vince Chen
# For root domain (chenqijunvc.github.io), baseurl should be empty
baseurl:            ""
url:                "https://chenqijunvc.github.io"

# SEO and Social
keywords:           "Vince Chen, investment architect, portfolio manager, quantitative researcher, free cash flow investing, Pure Alpha, investment methodology, quantitative finance"
lang:               "en"
locale:             "en_US"

# Social Profiles
twitter_username:
github_username:    chenqijunvc
linkedin_username:  vinceqijunchen

# Analytics - Replace with your actual Google Analytics 4 ID
# google_analytics:   G-XXXXXXXXXX

# Author information for structured data
author_info:
  name:             "Vince Chen"
  bio:              "Investment Architect. Portfolio Manager. Quantitative Researcher. My work focuses on designing investment research, quantitative methodologies, portfolio processes, and institutional investment infrastructure."
  location:         "Global"
  expertise:        ["Investment Architecture", "Quantitative Research", "Portfolio Management", "ETF Strategy", "Investment Methodology"]

# Build settings
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"

# URL structure - no trailing slashes
permalink:          /:title/

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# Collections
collections:
  media:
    output: true
    permalink: /media/:title/

# Dynamic background images
default_backgrounds:
  home: '/img/bg-index.jpg'
  about: '/img/bg-about.jpg'
  posts: '/img/bg-post.jpg'
  contact: '/img/bg-contact.jpg'
  search: '/img/bg-post.jpg'
  default: '/img/bg-post.jpg'

# Category-specific backgrounds
category_backgrounds:
  ai: '/img/bg-post.jpg'
  finance: '/img/bg-post.jpg'
  data-science: '/img/bg-post.jpg'
