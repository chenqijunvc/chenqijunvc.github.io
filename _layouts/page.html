---
layout: default
---

<a href="#main-content" class="skip-nav">Skip to content</a>

<header class="page-header-clean">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-md-11 mx-auto">
        {% if page.kicker %}<p class="page-kicker">{{ page.kicker }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="page-subhead">{{ page.description }}</p>
        {% endif %}
      </div>
    </div>
  </div>
</header>

<main id="main-content" class="page-content-fade">
  <div class="container{% if page.wide %} content-wide{% endif %}" style="padding-top: 3.5rem; padding-bottom: 5rem;">
    <div class="row">
      <div class="col-lg-10 col-md-11 mx-auto{% if page.wide %} col-content{% endif %}">

        {{ content }}

      </div>
    </div>
  </div>
</main>
