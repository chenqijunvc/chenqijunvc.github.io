---
layout: page
title: Search Writing
description: "Search Vince Chen's investment research and articles."
background: '/img/bg-post.jpg'
sitemap: false
---

<div class="row">
  <div class="col-lg-10 col-md-12 mx-auto">
    <div class="form-group mb-5">
      <label for="search-input" class="sr-only">Search writing</label>
      <input type="search" class="form-control form-control-lg" id="search-input" placeholder="Search research and articles…" autocomplete="off">
    </div>
    <div id="search-results" class="writing-list"></div>
    <p id="search-empty" class="text-muted">Start typing to search the writing archive.</p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  const empty = document.getElementById('search-empty');
  const posts = [
    {% for post in site.posts %}{
      title: {{ post.title | jsonify }},
      url: {{ post.url | relative_url | jsonify }},
      year: {{ post.date | date: '%Y' | jsonify }},
      excerpt: {{ post.excerpt | strip_html | normalize_whitespace | jsonify }},
      tags: {{ post.tags | join: ' ' | jsonify }}
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ];

  function escapeHtml(value) {
    return value.replace(/[&<>'"]/g, function (char) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char];
    });
  }

  function render(query) {
    const q = query.trim().toLowerCase();
    if (q.length < 2) {
      results.innerHTML = '';
      empty.textContent = 'Start typing to search the writing archive.';
      empty.style.display = 'block';
      return;
    }
    const matches = posts.filter(function (post) {
      return [post.title, post.excerpt, post.tags].join(' ').toLowerCase().includes(q);
    });
    if (!matches.length) {
      results.innerHTML = '';
      empty.textContent = 'No matching articles.';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    results.innerHTML = matches.map(function (post) {
      return '<article class="writing-row"><div class="writing-date">' + escapeHtml(post.year) + '</div><div class="writing-copy"><h3><a href="' + escapeHtml(post.url) + '">' + escapeHtml(post.title) + '</a></h3><p>' + escapeHtml(post.excerpt) + '</p></div></article>';
    }).join('');
  }
  input.addEventListener('input', function () { render(input.value); });
});
</script>
